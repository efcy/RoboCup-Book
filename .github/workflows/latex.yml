name: Build and Release LaTeX

on:
  push:
    branches: ["master"]

permissions:
  contents: write

jobs:
  build_foundation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Compile with pdflatex (x2)
        uses: xu-cheng/latex-action@v4
        with:
          working_directory: ./foundation_book
          root_file: main.tex
          compiler: pdflatex
          args: -synctex=1 -interaction=nonstopmode -file-line-error
          pre_compile: |
            pdflatex -synctex=1 -interaction=nonstopmode -file-line-error main.tex

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: build-${{ github.run_number }}
          name: RoboCup-Foundation-Book #${{ github.run_number }} (${{ github.sha }})
          files: foundation_book/main.pdf
          generate_release_notes: true

  build_practice:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Compile with pdflatex (x2)
        uses: xu-cheng/latex-action@v4        
        with:
          working_directory: ./practice_book_01
          root_file: main.tex
          compiler: pdflatex
          args: -synctex=1 -interaction=nonstopmode -file-line-error
          pre_compile: |
            pdflatex -synctex=1 -interaction=nonstopmode -file-line-error main.tex

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3

        with:
          tag_name: build-${{ github.run_number }}
          name: RoboCup-Practice-Book #${{ github.run_number }} (${{ github.sha }})
          files: ./practice_book_01/main.pdf
          generate_release_notes: true
